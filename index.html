<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Cut</title>
<meta name="description" content="Rashed's eight-week training and nutrition programme: the gym, the kitchen and the court.">
<meta name="theme-color" content="#04060A">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Cut">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Jost:wght@400..700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="art/gym-p0.webp">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<div class="room" aria-hidden="true"><i data-r="gym"></i><i data-r="eat"></i><i data-r="tennis"></i><i data-r="rest"></i></div>

<main id="phone" class="wait" data-view="today" data-mode="eat">
  <section class="view" data-view="today" aria-label="Today"></section>
  <section class="view" data-view="train" aria-label="Train"></section>
  <section class="view" data-view="eat" aria-label="Eat"></section>
  <section class="view" data-view="progress" aria-label="Progress"></section>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="today" aria-current="page">Today</button>
    <button type="button" data-tab="train">Train</button>
    <button type="button" data-tab="eat">Eat</button>
    <button type="button" data-tab="progress">Progress</button>
  </nav>

  <div id="layers"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <button id="update" type="button" hidden>New version. Tap to update.</button>

  <div id="opening" aria-hidden="true">
    <div class="cam"><div class="lo"><img src="art/gym-w0.webp" alt="" data-box="0,-240,2576,1447"><img src="art/gym-p0.webp" alt="" data-box="620,-100,1960,1400"></div></div>
    <i class="veil"></i><i class="sh a"></i><i class="sh b"></i><i class="slit"></i>
    <div class="word"></div>
    <i class="flash"></i>
  </div>
</main>

<div id="print" aria-hidden="true"></div>
<noscript><p style="color:#F1F5FA;font-family:sans-serif;padding:24px">This programme needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
